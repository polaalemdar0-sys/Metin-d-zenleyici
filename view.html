<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turhan TV HD Premium - İçerik</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #0d1520;
            --border-color: #2a3a52;
            --text-primary: #f0f4ff;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.2);
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .premium-container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(99, 102, 241, 0.05),
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .premium-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* HEADER */
        .premium-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand .icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .header-brand .name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-brand .badge {
            font-size: 0.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-status .code-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            background: var(--bg-input);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* TIMER */
        .timer-premium {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .timer-premium.urgent {
            animation: pulse 1s ease-in-out infinite;
            background: rgba(239, 68, 68, 0.15);
        }

        .timer-premium i {
            font-size: 0.9rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        /* İÇERİK ALANI */
        .premium-content {
            padding: 32px;
        }

        .premium-content .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .premium-content .meta-bar .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .premium-content .meta-bar .meta-item i {
            color: var(--accent);
            width: 16px;
        }

        .content-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            min-height: 280px;
            max-height: 550px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
            transition: border-color 0.3s;
        }

        .content-card:hover {
            border-color: var(--accent);
        }

        .content-card::-webkit-scrollbar {
            width: 6px;
        }
        .content-card::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 10px;
        }
        .content-card::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        .content-card::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Şifre Modal - Premium */
        .password-premium {
            text-align: center;
            padding: 30px 20px;
        }

        .password-premium .lock-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .password-premium h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .password-premium p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .password-premium .input-group {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .password-premium .input-group input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-premium .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .password-premium .input-group .btn-unlock {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-premium .input-group .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .password-premium .decrypted-box {
            margin-top: 20px;
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
            text-align: left;
        }

        /* EXPIRED - Premium */
        .expired-premium {
            text-align: center;
            padding: 60px 30px;
        }

        .expired-premium .icon {
            font-size: 5rem;
            color: var(--danger);
            margin-bottom: 16px;
            display: block;
        }

        .expired-premium h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .expired-premium p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 28px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* AKSİYON BUTONLARI */
        .premium-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .premium-actions .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .premium-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
        }

        .premium-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .premium-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .premium-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .premium-actions .btn-gold {
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: white;
        }

        .premium-actions .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--gold-glow);
        }

        /* FOOTER */
        .premium-footer {
            padding: 16px 32px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(17, 24, 39, 0.6);
        }

        .premium-footer .footer-links {
            display: flex;
            gap: 20px;
        }

        .premium-footer .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .premium-footer .footer-links a:hover {
            color: var(--accent);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .premium-header { padding: 18px 20px; flex-direction: column; align-items: flex-start; }
            .header-status { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .premium-content { padding: 20px; }
            .content-card { padding: 18px; min-height: 200px; max-height: 400px; font-size: 0.85rem; }
            .password-premium .input-group { flex-direction: column; }
            .password-premium .input-group .btn-unlock { justify-content: center; }
            .premium-actions { justify-content: center; }
            .premium-footer { flex-direction: column; text-align: center; }
            .premium-footer .footer-links { justify-content: center; }
        }

        @media (max-width: 480px) {
            .premium-container { border-radius: 16px; }
            .premium-header { padding: 14px 16px; }
            .header-brand .name { font-size: 1rem; }
            .premium-content { padding: 14px; }
            .content-card { padding: 14px; min-height: 150px; font-size: 0.8rem; }
            .expired-premium h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="premium-container" id="premiumContainer">
    <!-- HEADER -->
    <div class="premium-header">
        <div class="header-brand">
            <div class="icon"><i class="fa-solid fa-tv"></i></div>
            <span class="name">Turhan TV HD</span>
            <span class="badge">Premium</span>
        </div>
        <div class="header-status">
            <span class="code-badge" id="codeBadge">/</span>
            <div class="timer-premium" id="timerDisplay" style="display:none;">
                <i class="fa-solid fa-stopwatch"></i>
                <span id="timerText">Kalan Süre</span>
            </div>
        </div>
    </div>

    <!-- İÇERİK -->
    <div class="premium-content" id="contentArea">
        <!-- Dinamik içerik buraya gelecek -->
    </div>

    <!-- FOOTER -->
    <div class="premium-footer">
        <span><i class="fa-regular fa-copyright"></i> 2024 Turhan TV HD Premium</span>
        <div class="footer-links">
            <a href="#" onclick="window.location.href=window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + 'index.html'">
                <i class="fa-solid fa-plus"></i> Yeni Metin
            </a>
            <a href="#" onclick="copyContent()"><i class="fa-regular fa-copy"></i> Kopyala</a>
            <a href="#" onclick="downloadContent()"><i class="fa-regular fa-file-lines"></i> İndir</a>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // === PREMIUM VIEW PAGE - TÜM MANTIK ===
    // ============================================================
    
    // URL'den veriyi al
    const params = new URLSearchParams(window.location.search);
    const encodedData = params.get('d');
    const code = params.get('code') || '???';
    
    // Kod badge'ini güncelle
    document.getElementById('codeBadge').textContent = '/' + code;
    
    if (!encodedData) {
        document.getElementById('contentArea').innerHTML = `
            <div class="expired-premium">
                <span class="icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
                <h2>Geçersiz Link</h2>
                <p>Bu link geçersiz veya bozuk. Lütfen yeni bir link oluşturun.</p>
                <div class="premium-actions" style="justify-content:center;">
                    <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                </div>
            </div>
        `;
    } else {
        try {
            const jsonString = decodeURIComponent(escape(atob(encodedData)));
            const payload = JSON.parse(jsonString);
            
            console.log('📦 Premium Payload:', payload);
            
            // Süre kontrolü
            if (payload.d > 0) {
                const now = Math.floor(Date.now() / 1000);
                const expiresAt = payload.t + payload.d;
                
                if (now > expiresAt) {
                    // Süre dolmuş
                    document.getElementById('contentArea').innerHTML = `
                        <div class="expired-premium">
                            <span class="icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
                            <h2>Bu Bağlantının Süresi Dolmuştur</h2>
                            <p>Link süresi dolduğu için bu içeriğe artık erişilemez.</p>
                            <div class="premium-actions" style="justify-content:center;">
                                <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                            </div>
                        </div>
                    `;
                    // Timer'ı gizle
                    document.getElementById('timerDisplay').style.display = 'none';
                } else {
                    // Süre aktif, sayacı başlat
                    startPremiumCountdown(expiresAt);
                    showPremiumContent(payload);
                }
            } else {
                // Süresiz
                document.getElementById('timerDisplay').style.display = 'none';
                showPremiumContent(payload);
            }
            
        } catch(e) {
            console.error('❌ Hata:', e);
            document.getElementById('contentArea').innerHTML = `
                <div class="expired-premium">
                    <span class="icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
                    <h2>Geçersiz Link</h2>
                    <p>Bu link geçersiz veya bozuk.</p>
                    <div class="premium-actions" style="justify-content:center;">
                        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                    </div>
                </div>
            `;
        }
    }
    
    // === İÇERİK GÖSTER ===
    function showPremiumContent(payload) {
        const contentArea = document.getElementById('contentArea');
        
        if (payload.e === 1) {
            // Şifreli içerik
            contentArea.innerHTML = `
                <div class="password-premium">
                    <span class="lock-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <h3>Bu İçerik Parola İle Korunuyor</h3>
                    <p>Lütfen erişim parolasını girin.</p>
                    <div class="input-group">
                        <input type="password" id="premiumPassInput" placeholder="Parola">
                        <button class="btn-unlock" onclick="unlockPremiumContent('${payload.c}')">
                            <i class="fa-solid fa-unlock"></i> Aç
                        </button>
                    </div>
                    <div class="decrypted-box" id="premiumDecryptedBox"></div>
                </div>
            `;
        } else {
            // Açık içerik
            contentArea.innerHTML = `
                <div class="meta-bar">
                    <span class="meta-item"><i class="fa-regular fa-file-lines"></i> İçerik</span>
                    <span class="meta-item"><i class="fa-regular fa-clock"></i> ${new Date().toLocaleString('tr-TR')}</span>
                </div>
                <div class="content-card" id="premiumContentCard">${escapeHtml(payload.c)}</div>
                <div class="premium-actions">
                    <button class="btn btn-primary" onclick="copyPremiumContent()"><i class="fa-regular fa-copy"></i> Kopyala</button>
                    <button class="btn btn-secondary" onclick="downloadPremiumContent()"><i class="fa-regular fa-file-lines"></i> İndir</button>
                    <a href="index.html" class="btn btn-gold"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                </div>
            `;
        }
    }
    
    // === HTML ESCAPE ===
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // === ŞİFRE ÇÖZ ===
    function unlockPremiumContent(encryptedData) {
        const pass = document.getElementById('premiumPassInput');
        if (!pass) return;
        
        const password = pass.value;
        if (!password) {
            alert('Lütfen parolayı girin.');
            return;
        }
        
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedData, password);
            const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
            
            if (!decryptedText) {
                alert('Hatalı parola!');
                return;
            }
            
            const box = document.getElementById('premiumDecryptedBox');
            if (box) {
                box.textContent = decryptedText;
                box.style.display = 'block';
                
                // İçeriği gösteren butonlar ekle
                const actions = document.createElement('div');
                actions.className = 'premium-actions';
                actions.style.marginTop = '16px';
                actions.style.justifyContent = 'center';
                actions.innerHTML = `
                    <button class="btn btn-primary" onclick="copyPremiumContentFromBox()"><i class="fa-regular fa-copy"></i> Kopyala</button>
                    <button class="btn btn-secondary" onclick="downloadPremiumContentFromBox()"><i class="fa-regular fa-file-lines"></i> İndir</button>
                    <a href="index.html" class="btn btn-gold"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                `;
                box.parentNode.appendChild(actions);
                
                // İçeriği global olarak sakla
                window._premiumDecryptedText = decryptedText;
            }
        } catch(e) {
            alert('Hatalı parola!');
        }
    }
    
    // === KOPYALA (Açık içerik) ===
    function copyPremiumContent() {
        const card = document.getElementById('premiumContentCard');
        if (card) {
            navigator.clipboard.writeText(card.textContent);
        }
    }
    
    // === İNDİR (Açık içerik) ===
    function downloadPremiumContent() {
        const card = document.getElementById('premiumContentCard');
        if (!card) return;
        const text = card.textContent;
        if (!text.trim()) return;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `turhan_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    // === KOPYALA (Şifreli çözülen) ===
    function copyPremiumContentFromBox() {
        const text = window._premiumDecryptedText;
        if (text) {
            navigator.clipboard.writeText(text);
        }
    }
    
    // === İNDİR (Şifreli çözülen) ===
    function downloadPremiumContentFromBox() {
        const text = window._premiumDecryptedText;
        if (!text || !text.trim()) return;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `turhan_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    // === SÜRE SAYACI (Premium) ===
    let premiumCountdownInterval = null;
    
    function startPremiumCountdown(expiresAt) {
        const timerDisplay = document.getElementById('timerDisplay');
        const timerText = document.getElementById('timerText');
        
        if (!timerDisplay || !timerText) return;
        
        timerDisplay.style.display = 'inline-flex';
        
        if (premiumCountdownInterval) {
            clearInterval(premiumCountdownInterval);
            premiumCountdownInterval = null;
        }
        
        const updateTimer = () => {
            const now = Math.floor(Date.now() / 1000);
            const diff = expiresAt - now;
            
            if (diff <= 0) {
                clearInterval(premiumCountdownInterval);
                premiumCountdownInterval = null;
                timerDisplay.style.display = 'none';
                
                document.getElementById('contentArea').innerHTML = `
                    <div class="expired-premium">
                        <span class="icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
                        <h2>Bu Bağlantının Süresi Dolmuştur</h2>
                        <p>Link süresi dolduğu için bu içeriğe artık erişilemez.</p>
                        <div class="premium-actions" style="justify-content:center;">
                            <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                        </div>
                    </div>
                `;
                return;
            }
            
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;
            
            let timeStr = '';
            if (minutes > 0) {
                timeStr += `${minutes}dk `;
            }
            timeStr += `${seconds}sn`;
            
            timerText.textContent = `Kalan Süre: ${timeStr}`;
            timerDisplay.classList.toggle('urgent', diff < 300);
        };
        
        updateTimer();
        premiumCountdownInterval = setInterval(updateTimer, 1000);
    }
    
    // === KOPYALA (Global) ===
    function copyContent() {
        const card = document.getElementById('premiumContentCard');
        const box = document.getElementById('premiumDecryptedBox');
        
        if (card) {
            navigator.clipboard.writeText(card.textContent);
        } else if (box && box.style.display !== 'none') {
            navigator.clipboard.writeText(box.textContent);
        } else {
            alert('Kopyalanacak içerik yok!');
        }
    }
    
    // === İNDİR (Global) ===
    function downloadContent() {
        const card = document.getElementById('premiumContentCard');
        const box = document.getElementById('premiumDecryptedBox');
        
        let text = '';
        if (card) {
            text = card.textContent;
        } else if (box && box.style.display !== 'none') {
            text = box.textContent;
        }
        
        if (!text || !text.trim()) {
            alert('İndirilecek içerik yok!');
            return;
        }
        
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `turhan_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    console.log('✅ Turhan TV HD Premium View başlatıldı!');
    console.log('📝 Kod:', code);
</script>
