<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turhan TV HD - İçerik</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .view-container {
            max-width: 800px;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .view-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .view-header .brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        .view-header .code-badge {
            color: var(--accent);
            font-family: monospace;
            font-size: 0.9rem;
            background: var(--input-bg);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
        }
        .view-content {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--panel-border);
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .view-content::-webkit-scrollbar {
            width: 6px;
        }
        .view-content::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 10px;
        }
        .view-content::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 10px;
        }
        .view-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.15s;
            text-decoration: none;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }
        .timer-badge {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .timer-badge.urgent {
            background: rgba(239, 68, 68, 0.2);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .password-modal {
            text-align: center;
            padding: 20px 0;
        }
        .password-modal .icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .password-modal h3 {
            margin-bottom: 8px;
            font-size: 1.2rem;
        }
        .password-modal p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .password-input-group {
            max-width: 360px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }
        .password-input-group input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }
        .password-input-group input:focus { border-color: var(--accent); }
        .expired-section {
            text-align: center;
            padding: 40px 20px;
        }
        .expired-section .icon {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 16px;
        }
        .expired-section h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .expired-section p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div class="view-container" id="viewContainer">
    <div class="view-header">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-tv"></i></div>
            <span>Turhan TV HD</span>
        </div>
        <div id="codeBadge" class="code-badge">/</div>
    </div>

    <div id="contentArea">
        <!-- İçerik buraya gelecek -->
    </div>

    <div class="view-actions">
        <button class="btn btn-secondary" onclick="copyContent()">
            <i class="fa-solid fa-copy"></i> Kopyala
        </button>
        <button class="btn btn-secondary" onclick="downloadContent()">
            <i class="fa-solid fa-download"></i> İndir
        </button>
        <a href="index.html" class="btn">
            <i class="fa-solid fa-plus"></i> Yeni Metin
        </a>
    </div>
</div>

<script>
    // URL'den veriyi al
    const params = new URLSearchParams(window.location.search);
    const encodedData = params.get('d');
    
    if (!encodedData) {
        document.getElementById('contentArea').innerHTML = `
            <div class="expired-section">
                <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h2>Geçersiz Link!</h2>
                <p>Bu link geçersiz veya bozuk.</p>
                <a href="index.html" class="btn"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
            </div>
        `;
    } else {
        try {
            const jsonString = decodeURIComponent(escape(atob(encodedData)));
            const payload = JSON.parse(jsonString);
            
            // Kod göster
            const code = params.get('code') || '???';
            document.getElementById('codeBadge').textContent = '/' + code;
            
            if (payload.d > 0) {
                const expiresAt = payload.t + payload.d;
                startCountdown(expiresAt);
            }
            
            if (payload.e === 1) {
                // Şifreli içerik
                document.getElementById('contentArea').innerHTML = `
                    <div class="password-modal">
                        <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
                        <h3>Bu İçerik Parola İle Korunuyor</h3>
                        <p>Lütfen erişim parolasını girin.</p>
                        <div class="password-input-group">
                            <input type="password" id="passInput" placeholder="Parola">
                            <button class="btn" onclick="unlockContent()"><i class="fa-solid fa-unlock"></i> Aç</button>
                        </div>
                        <div id="decryptedContent" style="margin-top:15px; background:var(--input-bg); border-radius:12px; padding:20px; border:1px solid var(--panel-border); font-family:'Fira Code',monospace; white-space:pre-wrap; word-break:break-word; display:none;"></div>
                    </div>
                `;
                window._encryptedPayload = payload.c;
            } else {
                // Açık içerik
                document.getElementById('contentArea').innerHTML = `
                    <div class="view-content" id="textContent">${escapeHtml(payload.c)}</div>
                `;
            }
            
        } catch(e) {
            document.getElementById('contentArea').innerHTML = `
                <div class="expired-section">
                    <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h2>Geçersiz Link!</h2>
                    <p>Bu link geçersiz veya bozuk.</p>
                    <a href="index.html" class="btn"><i class="fa-solid fa-plus"></i> Yeni Metin Oluştur</a>
                </div>
            `;
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function startCountdown(expiresAt) {
        const container = document.getElementById('viewContainer');
        const timerBadge = document.createElement('div');
        timerBadge.className = 'timer-badge';
        timerBadge.id = 'timerDisplay';
        document.querySelector('.view-header').appendChild(timerBadge);
        
        const updateTimer = () => {
            const now = Math.floor(Date.now() / 1000);
            const diff = expiresAt - now;
            
            if (diff <= 0) {
                clearInterval(window._countdownInterval);
                document.getElementById('contentArea').innerHTML = `
                    <div class="expired-section">
                        <div class="icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                        <h2>Bu Bağlantının Süresi Dolmuştur!</h2>
                        <p>Link süresi dolduğu için bu içeriğe artık erişilemez.</p>
                        <a href="index.html" class="btn"><i class="fa-solid fa-plus"></i> Yeni İçerik Oluştur</a>
                    </div>
                `;
                document.getElementById('timerDisplay')?.remove();
                return;
            }
            
            const days = Math.floor(diff / (24 * 3600));
            const hours = Math.floor((diff % (24 * 3600)) / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            
            let timeStr = "";
            if (days > 0) timeStr += `${days}g `;
            if (hours > 0 || days > 0) timeStr += `${hours}sa `;
            timeStr += `${minutes}dk ${seconds < 10 ? '0' : ''}${seconds}sn`;
            
            timerBadge.innerHTML = `<i class="fa-solid fa-stopwatch"></i> Kalan Süre: ${timeStr}`;
            timerBadge.classList.toggle('urgent', diff < 300);
        };
        
        updateTimer();
        window._countdownInterval = setInterval(updateTimer, 1000);
    }
    
    function unlockContent() {
        const pass = document.getElementById('passInput').value;
        if (!pass) return alert('Lütfen parolayı girin.');
        
        try {
            const bytes = CryptoJS.AES.decrypt(window._encryptedPayload, pass);
            const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
            
            if (!decryptedText) return alert('Hatalı parola!');
            
            const el = document.getElementById('decryptedContent');
            el.textContent = decryptedText;
            el.style.display = 'block';
            
            // Ayrıca textContent olarak da sakla
            window._decryptedText = decryptedText;
        } catch(e) {
            alert('Hatalı parola!');
        }
    }
    
    function copyContent() {
        const content = document.getElementById('textContent');
        if (content) {
            navigator.clipboard.writeText(content.textContent);
        } else {
            const decrypted = document.getElementById('decryptedContent');
            if (decrypted && decrypted.style.display !== 'none') {
                navigator.clipboard.writeText(decrypted.textContent);
            }
        }
    }
    
    function downloadContent() {
        const content = document.getElementById('textContent');
        let text = '';
        if (content) {
            text = content.textContent;
        } else {
            const decrypted = document.getElementById('decryptedContent');
            if (decrypted && decrypted.style.display !== 'none') {
                text = decrypted.textContent;
            }
        }
        
        if (!text) return alert('İndirilecek içerik yok!');
        
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `turhan_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
</script>

</body>
</html>
