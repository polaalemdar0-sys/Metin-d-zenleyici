<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editör Pro - Gelişmiş Metin & Kod Paylaşımı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19; --panel-bg: #111827; --panel-border: #1f2937;
            --accent: #6366f1; --accent-hover: #4f46e5; --text-main: #f9fafb;
            --text-muted: #9ca3af; --input-bg: #080c14; --danger: #ef4444;
        }
        .light-mode {
            --bg-main: #f3f4f6; --panel-bg: #ffffff; --panel-border: #e5e7eb;
            --accent: #4f46e5; --accent-hover: #4338ca; --text-main: #111827;
            --text-muted: #6b7280; --input-bg: #f9fafb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px 16px; transition: background-color 0.3s; }
        .app-container { max-width: 900px; width: 100%; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow: hidden; display: flex; flex-direction: column; }
        .app-header { padding: 16px 24px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
        .app-body { padding: 24px; }
        .settings-panel { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; background: var(--input-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--panel-border); }
        .setting-item { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
        .setting-item input, .setting-item select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--panel-bg); color: var(--text-main); outline: none; }
        textarea { width: 100%; height: 300px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--panel-border); border-radius: 14px; padding: 18px; font-family: 'Fira Code', monospace; outline: none; resize: vertical; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--panel-border); }
        .share-box { margin-top: 16px; background: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px; display: none; }
        .share-input-group { display: flex; gap: 10px; margin-top: 8px; }
        .share-input-group input { flex: 1; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; color: var(--accent); }
        #viewSection, #passwordPromptSection, #expiredSection { display: none; }
        .view-card { background: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 14px; padding: 24px; font-family: 'Fira Code', monospace; white-space: pre-wrap; word-break: break-word; }
        .timer-badge { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; }
        .status-bar { padding: 10px 24px; background: var(--input-bg); border-top: 1px solid var(--panel-border); display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
            <span>Editör Pro</span>
        </div>
        <button class="btn btn-secondary" onclick="document.body.classList.toggle('light-mode')"><i class="fa-solid fa-circle-half-stroke"></i> Tema</button>
    </div>

    <div class="app-body">
        <!-- EDITÖR -->
        <div id="editorSection">
            <div class="settings-panel">
                <div class="setting-item">
                    <label><i class="fa-solid fa-lock"></i> Parola:</label>
                    <input type="password" id="linkPassword" placeholder="İsteğe bağlı şifre">
                </div>
                <div class="setting-item">
                    <label><i class="fa-solid fa-hourglass-half"></i> Süre:</label>
                    <select id="linkExpiry">
                        <option value="0">Süresiz</option>
                        <option value="600">10 Dakika</option>
                        <option value="3600">1 Saat</option>
                        <option value="86400">24 Saat</option>
                    </select>
                </div>
            </div>

            <textarea id="editor" placeholder="Metninizi yazın..." oninput="updateStats()"></textarea>
            
            <div class="action-bar" style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn" onclick="generateShareLink()"><i class="fa-solid fa-bolt"></i> Bağlantı Oluştur & Kısalt</button>
            </div>

            <div class="share-box" id="shareBox">
                <p style="font-size: 0.85rem;">Paylaşılabilir Link:</p>
                <div class="share-input-group">
                    <input type="text" id="shareUrl" readonly>
                    <button class="btn" onclick="copyText()">Kopyala</button>
                </div>
            </div>
        </div>

        <!-- EKRANLAR -->
        <div id="expiredSection" style="text-align:center; padding: 40px 0;">
            <h2>Süresi Doldu!</h2>
            <a href="index.html" class="btn">Yeni Metin Oluştur</a>
        </div>

        <div id="passwordPromptSection" style="text-align:center; padding: 30px 0;">
            <h3>İçerik Parola İle Korunuyor</h3>
            <input type="password" id="inputDecryptPassword" placeholder="Parola" style="padding:10px; margin:10px 0; border-radius:8px; border:1px solid #333; background:#000; color:#fff;">
            <button class="btn" onclick="unlockContent()">Aç</button>
        </div>

        <div id="viewSection">
            <div id="timerDisplay" class="timer-badge" style="display:none; margin-bottom:10px;"></div>
            <div class="view-card" id="textContent"></div>
            <button class="btn btn-secondary" onclick="copyContent()" style="margin-top:10px;">Kopyala</button>
        </div>
    </div>

    <div class="status-bar">
        <span id="charCount">Karakter: 0</span>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    let encryptedDataPayload = null;

    // Link Kısaltma Fonksiyonu
    async function shortenUrl(longUrl) {
        try {
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
            return response.ok ? await response.text() : longUrl;
        } catch(e) { return longUrl; }
    }

    function updateStats() {
        document.getElementById('charCount').textContent = `Karakter: ${editor.value.length}`;
    }

    async function generateShareLink() {
        if (!editor.value.trim()) return alert('Metin giriniz!');
        const pass = document.getElementById('linkPassword').value;
        const dur = parseInt(document.getElementById('linkExpiry').value);
        const createdAt = Math.floor(Date.now() / 1000);
        let content = pass ? CryptoJS.AES.encrypt(editor.value, pass).toString() : editor.value;

        const payload = { c: content, e: pass ? 1 : 0, t: createdAt, d: dur };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        const longUrl = window.location.origin + window.location.pathname + '#' + encoded;
        
        const shareInput = document.getElementById('shareUrl');
        shareInput.value = "Kısaltılıyor...";
        document.getElementById('shareBox').style.display = 'block';
        
        const short = await shortenUrl(longUrl);
        shareInput.value = short;
    }

    async function unlockContent() {
        const pass = document.getElementById('inputDecryptPassword').value;
        try {
            const dec = CryptoJS.AES.decrypt(encryptedDataPayload, pass).toString(CryptoJS.enc.Utf8);
            if (!dec) throw new Error();
            document.getElementById('passwordPromptSection').style.display = 'none';
            document.getElementById('textContent').textContent = dec;
            document.getElementById('viewSection').style.display = 'block';
        } catch(e) { alert('Hatalı parola!'); }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const hash = window.location.hash.substring(1);
        if (hash) {
            document.getElementById('editorSection').style.display = 'none';
            const payload = JSON.parse(decodeURIComponent(escape(atob(hash))));
            
            // Süre kontrolü
            if (payload.d > 0) {
                const now = Math.floor(Date.now() / 1000);
                if ((payload.t + payload.d) < now) {
                    document.getElementById('expiredSection').style.display = 'block';
                    return;
                }
            }

            if (payload.e === 1) {
                encryptedDataPayload = payload.c;
                document.getElementById('passwordPromptSection').style.display = 'block';
            } else {
                document.getElementById('textContent').textContent = payload.c;
                document.getElementById('viewSection').style.display = 'block';
            }
        }
    });

    function copyText() { navigator.clipboard.writeText(document.getElementById('shareUrl').value); alert('Kopyalandı!'); }
    function copyContent() { navigator.clipboard.writeText(document.getElementById('textContent').textContent); alert('İçerik Kopyalandı!'); }
</script>
</body>
</html>
